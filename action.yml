name: 'AutoCloud Operator GitHub Action'
description: 'Invokes the Google Cloud AutoCloud Operator agent via MCP to review IaC & code changes.'
author: 'Google Cloud AutoCloud Team'

branding:
  icon: 'cloud'
  color: 'blue'

inputs:
  config_path:
    description: 'Path to .github/autocloud.yml relative to workspace.'
    required: false
    default: '.github/autocloud.yml'
  mcp_url:
    description: 'HTTPS endpoint for Gemini Cloud Assist MCP server.'
    required: false
    default: 'https://geminicloudassist.sandbox.googleapis.com/mcp'

runs:
  using: 'composite'
  steps:
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install AutoCloud Action dependencies
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: |
        python -m pip install --upgrade pip
        python -m pip install "$ACTION_PATH"

    - name: Execute AutoCloud Operator Runner
      shell: bash
      env:
        AUTOCLOUD_MCP_URL: ${{ inputs.mcp_url }}
        AUTOCLOUD_WORKSPACE: ${{ github.workspace }}
        AUTOCLOUD_CONFIG_REL_PATH: ${{ inputs.config_path }}
      run: |
        autocloud-github-runner \
          --workspace_dir="$AUTOCLOUD_WORKSPACE" \
          --config_path="$AUTOCLOUD_WORKSPACE/$AUTOCLOUD_CONFIG_REL_PATH"
